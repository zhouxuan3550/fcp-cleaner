<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FCP Cleaner</title>
  <desc id="desc">一款扫描 Final Cut Pro 资源库、在验证后将可重建缓存移入废纸篓的 macOS 应用。</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1B1C20"/><stop offset="1" stop-color="#111215"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#5E6FE8"/><stop offset="1" stop-color="#8A62E6"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#121316"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="url(#surface)" stroke="#34363D" stroke-width="2"/>
  <g transform="translate(64 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect width="74" height="74" rx="21" fill="url(#accent)"/>
    <g fill="#FFF" transform="translate(16 15)"><path d="M13 0l3.5 9.5L26 13l-9.5 3.5L13 26l-3.5-9.5L0 13l9.5-3.5z"/><path d="M39 2l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/><path d="M35 28l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M6 31l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/></g>
    <text x="100" y="31" fill="#F4F4F6" font-size="47" font-weight="750">FCP Cleaner</text>
    <text x="100" y="60" fill="#AEB1BB" font-size="21" font-weight="600">自动扫描 · 安全清理 · 不碰原始素材</text>
    <text x="0" y="154" fill="#F4F4F6" font-size="31" font-weight="700">为 Final Cut Pro 腾出空间，</text>
    <text x="0" y="194" fill="#F4F4F6" font-size="31" font-weight="700">但不把资源库交给猜测。</text>
    <text x="0" y="235" fill="#AEB1BB" font-size="20">只处理可明确验证、可由 FCP 重新生成的渲染、代理与优化媒体。</text>
    <text x="0" y="269" fill="#AEB1BB" font-size="20">清理前复核占用状态、磁盘、数据库快照与文件指纹。</text>
  </g>
  <g transform="translate(680 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="0" fill="#858994" font-size="18" font-weight="700" letter-spacing="1.5">SAFE CLEANUP PROTOCOL</text>
    <path d="M24 84H384" stroke="#4A4D56" stroke-width="2"/><path d="M114 84H143M234 84H263" stroke="#7583EF" stroke-width="3"/>
    <g transform="translate(0 40)"><circle cx="24" cy="44" r="24" fill="#25272D" stroke="#484B55"/><path d="M12 36h10l4 4h10v12H12z" fill="none" stroke="#D9DADE" stroke-width="2.5" stroke-linejoin="round"/><text x="-2" y="100" fill="#D9DADE" font-size="20" font-weight="700">发现资源库</text><text x="-2" y="128" fill="#9498A3" font-size="18">.fcpbundle</text></g>
    <g transform="translate(120 40)"><circle cx="24" cy="44" r="24" fill="#25272D" stroke="#484B55"/><path d="M15 44l7 7 13-15" fill="none" stroke="#8E9AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="-12" y="100" fill="#D9DADE" font-size="20" font-weight="700">扫描并分类</text><text x="-2" y="128" fill="#9498A3" font-size="18">精确白名单</text></g>
    <g transform="translate(240 40)"><circle cx="24" cy="44" r="24" fill="#25272D" stroke="#484B55"/><path d="M24 27l12 5v10c0 9-5 15-12 18-7-3-12-9-12-18V32z" fill="none" stroke="#D9DADE" stroke-width="2.5" stroke-linejoin="round"/><text x="-5" y="100" fill="#D9DADE" font-size="20" font-weight="700">执行前复核</text><text x="-8" y="128" fill="#9498A3" font-size="18">占用与指纹</text></g>
    <g transform="translate(360 40)"><circle cx="24" cy="44" r="24" fill="url(#accent)"/><path d="M13 35h22M17 35v18h14V35M20 30h8M21 40v8M27 40v8" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="-7" y="100" fill="#F4F4F6" font-size="20" font-weight="700">移入废纸篓</text><text x="0" y="128" fill="#B9BEFF" font-size="18">可恢复</text></g>
    <rect x="0" y="208" width="456" height="78" rx="16" fill="#202126" stroke="#383B44"/><circle cx="28" cy="247" r="10" fill="#35C66B"/><path d="M23 247l4 4 7-9" fill="none" stroke="#101511" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="241" fill="#F1F2F4" font-size="20" font-weight="700">原始媒体、分析文件与未知目录</text><text x="54" y="268" fill="#AEB1BB" font-size="18">始终保留，不进入清理计划</text>
  </g>
</svg>
