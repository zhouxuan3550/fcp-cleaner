name: FCPLibraryCleaner
options:
  bundleIdPrefix: com.fcpcleaner
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  FCPLibraryCleanerCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/FCPLibraryCleanerCore
    settings:
      base:
        PRODUCT_MODULE_NAME: FCPLibraryCleanerCore

  FCP-Cleaner-Workflow:
    type: app-extension
    platform: macOS
    sources:
      - WorkflowExtension
      - path: Assets/FCP-Cleaner.icns
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: WorkflowExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WorkflowExtension/WorkflowExtension.entitlements
        MACOSX_DEPLOYMENT_TARGET: "15.6"
        PRODUCT_BUNDLE_IDENTIFIER: com.fcpcleaner.app.workflow-extension
        PRODUCT_NAME: FCP-Cleaner-Workflow
        PRODUCT_MODULE_NAME: FCPCleanerWorkflow
        MARKETING_VERSION: "4.0.1"
        CURRENT_PROJECT_VERSION: "401"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        MACH_O_TYPE: mh_execute
        LD_ENTRY_POINT: _ProExtensionMain
        WORKFLOW_EXTENSION_SDK_PATH: /Library/Developer/SDKs/WorkflowExtensionSDK.sdk
        ADDITIONAL_SDKS: $(WORKFLOW_EXTENSION_SDK_PATH)
        SWIFT_OBJC_BRIDGING_HEADER: WorkflowExtension/WorkflowExtension-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(WORKFLOW_EXTENSION_SDK_PATH)/usr/include
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(WORKFLOW_EXTENSION_SDK_PATH)/usr/lib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
          - '@executable_path/../../../../Frameworks'
        OTHER_LDFLAGS:
          - $(inherited)
          - -fapplication-extension
          - -lProExtension

  FCP-Cleaner:
    type: application
    platform: macOS
    sources:
      - Sources/FCPLibraryCleanerApp
      - path: Assets/FCP-Cleaner.icns
        buildPhase: resources
    dependencies:
      - target: FCPLibraryCleanerCore
      - package: Sparkle
        product: Sparkle
      - target: FCP-Cleaner-Workflow
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Distribution/FCP Cleaner.app/Contents/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.fcpcleaner.app
        PRODUCT_NAME: FCP Cleaner
        EXECUTABLE_NAME: FCP-Cleaner
        PRODUCT_MODULE_NAME: FCPLibraryCleanerApp
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        MARKETING_VERSION: "4.0.1"
        CURRENT_PROJECT_VERSION: "401"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
        CODE_SIGN_STYLE: Automatic

schemes:
  FCP-Cleaner:
    build:
      targets:
        FCP-Cleaner: all
        FCP-Cleaner-Workflow: all
    run:
      config: Debug
    archive:
      config: Release
