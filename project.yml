name: FCPLibraryCleaner
options:
  bundleIdPrefix: com.fcpcleaner
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  FCPLibraryCleanerCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/FCPLibraryCleanerCore
        excludes:
          - "**/*.baiduyun.uploading.cfg"
          - ".*.baiduyun.uploading.cfg"
    settings:
      base:
        PRODUCT_MODULE_NAME: FCPLibraryCleanerCore

  FCP-Cleaner-Workflow:
    type: app-extension
    platform: macOS
    sources:
      - WorkflowExtension
      - path: Assets/FCP-Cleaner.icns
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: WorkflowExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WorkflowExtension/WorkflowExtension.entitlements
        MACOSX_DEPLOYMENT_TARGET: "15.6"
        PRODUCT_BUNDLE_IDENTIFIER: com.fcpcleaner.app.workflow-extension
        PRODUCT_NAME: FCP-Cleaner-Workflow
        PRODUCT_MODULE_NAME: FCPCleanerWorkflow
        MARKETING_VERSION: "4.3.0"
        CURRENT_PROJECT_VERSION: "430"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        MACH_O_TYPE: mh_execute
        LD_ENTRY_POINT: _ProExtensionMain
        WORKFLOW_EXTENSION_SDK_PATH: /Library/Developer/SDKs/WorkflowExtensionSDK.sdk
        ADDITIONAL_SDKS: $(WORKFLOW_EXTENSION_SDK_PATH)
        SWIFT_OBJC_BRIDGING_HEADER: WorkflowExtension/WorkflowExtension-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(WORKFLOW_EXTENSION_SDK_PATH)/usr/include
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(WORKFLOW_EXTENSION_SDK_PATH)/usr/lib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
          - '@executable_path/../../../../Frameworks'
        OTHER_LDFLAGS:
          - $(inherited)
          - -fapplication-extension
          - -lProExtension

  fcp-library-scanner:
    type: tool
    platform: macOS
    sources:
      - path: Sources/fcp-library-scanner
    dependencies:
      - target: FCPLibraryCleanerCore
    settings:
      base:
        PRODUCT_NAME: fcp-library-scanner
        MARKETING_VERSION: "4.3.0"
        CURRENT_PROJECT_VERSION: "430"

  FCP-Cleaner:
    type: application
    platform: macOS
    sources:
      - path: Sources/FCPLibraryCleanerApp
        excludes:
          - "**/*.baiduyun.uploading.cfg"
          - ".*.baiduyun.uploading.cfg"
      - path: Assets/FCP-Cleaner.icns
        buildPhase: resources
      - path: Assets/BrandLogos.xcassets
        buildPhase: resources
    dependencies:
      - target: FCPLibraryCleanerCore
      - package: Sparkle
        product: Sparkle
      - target: FCP-Cleaner-Workflow
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Config/App-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.fcpcleaner.app
        PRODUCT_NAME: FCP Cleaner
        EXECUTABLE_NAME: FCP-Cleaner
        PRODUCT_MODULE_NAME: FCPLibraryCleanerApp
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        MARKETING_VERSION: "4.3.0"
        CURRENT_PROJECT_VERSION: "430"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
        CODE_SIGN_STYLE: Automatic

  FCP-CleanerCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FCPLibraryCleanerCoreTests
    dependencies:
      - target: FCP-Cleaner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FCP Cleaner.app/Contents/MacOS/FCP-Cleaner
        BUNDLE_LOADER: $(TEST_HOST)

  FCP-CleanerAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FCPLibraryCleanerAppTests
    dependencies:
      - target: FCP-Cleaner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FCP Cleaner.app/Contents/MacOS/FCP-Cleaner
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  FCP-Cleaner:
    build:
      targets:
        FCP-Cleaner: all
        FCP-Cleaner-Workflow: all
    test:
      config: Debug
      targets:
        - FCP-CleanerCoreTests
        - FCP-CleanerAppTests
    run:
      config: Debug
    archive:
      config: Release

  # 本机无 Workflow Extension SDK 时的测试入口：不含扩展 target。
  # 完整构建仍走 FCP-Cleaner scheme（release.sh）。
  FCP-Cleaner-Tests:
    build:
      targets:
        FCP-Cleaner: all
        fcp-library-scanner: all
    test:
      config: Debug
      targets:
        - FCP-CleanerCoreTests
        - FCP-CleanerAppTests
    run:
      config: Debug
